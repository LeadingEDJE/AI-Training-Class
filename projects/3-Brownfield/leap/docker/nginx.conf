server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # P5 (2026-07-30): nginx defaults to ABSOLUTE redirects built from $server_name + the LISTEN
    # port, so /compass/ and the legacy 301s emitted the container's internal port and the wrong
    # scheme to the browser. Relative redirects avoid reconstructing scheme/host/port at all;
    # port_in_redirect is belt-and-braces for any redirect nginx still builds absolutely.
    absolute_redirect off;
    port_in_redirect off;

    # P4 (2026-07-30, owner requirement): no caching anywhere in this SPA/PWA while the product is
    # under active development -- stale assets create confusion that is not worth the performance
    # win we do not currently need. `etag off` stops the browser from even attempting a conditional
    # revalidation. Revisit (here and at every `Cache-Control: no-store` below) if load becomes a
    # real concern. Last-Modified survives -- suppressing it needs a third-party headers module --
    # but it is inert under no-store.
    etag off;

    # Runtime config endpoint. Auth is a SAME-ORIGIN cookie session (phase 41): the SPA calls
    # relative URLs (/api, /auth, /Saml2) which nginx proxies to the API on this same host, so the
    # session cookie is first-party SameSite=Lax. __API_BASE_URL__ is therefore empty (relative);
    # no IDP base URL is injected anymore.
    # Every ${VAR} below MUST appear in docker/web.Dockerfile's NGINX_ENVSUBST_FILTER and have an
    # ENV default there, or the literal placeholder survives envsubst (Pitfall 3).
    # ⚠️ THIS DIRECTIVE'S PAYLOAD IS DELIMITED BY SINGLE QUOTES. Every ${VAR} below is
    # substituted RAW by envsubst, so any apostrophe in a value closes the string here and
    # nginx refuses to start -- `[emerg] unexpected "..."`, the container crash-loops, and
    # the deployment never becomes available. It shipped: a PR titled "...the pyramid
    # rebalance's judged comment pass" took its own preview down on 2026-08-28, four
    # deploys in a row, while api and postgres rolled out fine.
    # EPHEMERAL_LABEL is pre-formatted upstream (e.g. "PR #42: Add time category admin") and
    # sanitized to a WHITELIST in deploy-aws-preview.yml's "Resolve ephemeral badge label"
    # step -- pinned by .github/scripts/preview-label.test.js, which runs that very step.
    # Widening what reaches this line means widening that whitelist, deliberately.
    location = /config.js {
        default_type application/javascript;
        # Runtime config must never be served stale -- a cached config.js pins the preview label
        # to whatever it was at first load (P4).
        add_header Cache-Control "no-store" always;
        return 200 'window.__API_BASE_URL__="";window.__IS_EPHEMERAL_PREVIEW__="${IS_EPHEMERAL_PREVIEW}";window.__EPHEMERAL_LABEL__="${EPHEMERAL_LABEL}";';
    }

    # Same-origin API + auth surface (phase 41). Proxy the API paths to the API service so the
    # browser only ever talks to this one origin. ${API_URL} is substituted at container start from
    # the API_URL env var (NGINX_ENVSUBST_FILTER limits substitution to API_URL so nginx's own
    # $-variables survive). X-Forwarded-For/-Proto are forwarded so the API's ForwardedHeaders
    # middleware sees the original client scheme (Sustainsys must emit an https ACS URL).
    location /api/ {
        proxy_pass ${API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /auth/ {
        proxy_pass ${API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Sustainsys SP endpoints (metadata at /Saml2, assertion consumer at /Saml2/Acs). Prefix match
    # covers both the bare path and sub-paths.
    location /Saml2 {
        proxy_pass ${API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Never SPA-fallback an API-shaped path nested under a module scope (P1a hardening, 2026-07-30).
    # A regex location, so it is evaluated BEFORE the /compass/ prefix location; the required
    # intervening `.+/` means it can never match the real root-level /api or /Saml2.
    #
    # Why: a build-time env regression once left an SPA with a relative `baseURL`, so its requests
    # resolved under its own module path, the SPA fallback answered 200 + index.html, the SPA read
    # HTML where it expected JSON, and it looped into a bad-auth redirect. A hard 404 fails fast and
    # loudly instead.
    location ~ ^/compass/.+/(api|Saml2)/ {
        return 404;
    }

    # ---- EDJE Compass SPA at /compass/ --------------------------------------------------------
    # Bare-path 301 to the slash form, a prefix location carrying the SPA history fallback, and an
    # assets location so the hashed bundle is covered by the caching-off policy. These MUST sit
    # before `location /` or a Compass route falls through to the shell.
    #
    # There is deliberately NO `if` in any of these three locations. Compass has no availability
    # flag, so there is no decision to make. If one is ever added, compute it with a top-level
    # `map` and permit only an `if` whose sole action is `return`: entering a TRUE `if` branch
    # switches the request into nginx's implicit "if-location", which does NOT inherit try_files —
    # every deep link would then return a raw 404 while /compass/ itself keeps working, because
    # `index` resolves the root without the fallback. That failure mode is invisible to any test
    # suite that does not speak HTTP to a built image.
    location = /compass {
        return 301 /compass/$is_args$args;
    }

    location /compass/ {
        add_header Cache-Control "no-store" always;
        # `$is_args$args` is REQUIRED, not cosmetic: try_files' internal redirect to a bare
        # /compass/index.html DROPS the query string, so a query-parameterised deep link arrives at
        # the SPA with its arguments already gone.
        try_files $uri /compass/index.html$is_args$args;
    }

    # Compass's hashed assets live under /compass/assets/. P4: no-store during development; the
    # location is kept so restoring `expires 1y; add_header Cache-Control "public, immutable";`
    # is a one-line revert.
    location /compass/assets/ {
        add_header Cache-Control "no-store" always;
    }

    # SPA/shell routing: the html root is the LEAP landing shell -- its flat static files
    # (index.html, styles.css, shell.js, config.js, sw.js, manifest.webmanifest, icons/). try_files
    # serves those directly; the fallback hands unknown paths to the shell index (the shell is a
    # single page — no client router). The synthesized `location = /config.js` above shadows the
    # shell's static config.js in deployed envs (exact match beats this prefix).
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Shell PWA surface at scope / (D-21). The service worker must never be long-cached or update
    # checks would stall on a stale worker — serve it no-cache.
    # DELIBERATELY UNCHANGED by the P4 no-store sweep: sw.js registers NO fetch handler, so it caches
    # nothing; its only job is making the phone add-to-home-screen prompt work. no-cache is already
    # the correct policy for a service worker script.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Serve the shell manifest with the correct MIME (D-21). This image's bundled mime.types has NO
    # .webmanifest mapping (verified in-image), so without this default_type the file would serve as
    # application/octet-stream; the exact-match location overrides it to application/manifest+json.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
    }

    # Health check endpoint (this web container's own liveness — NOT proxied to the API)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
