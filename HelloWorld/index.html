<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    /* Leading EDJE theme colors, taken from leadingedje.com's --le-theme-* variables */
    :root {
      --le-theme-le-green: #98c93d;
      --le-theme-le-green-shade: #6fb03a;
      --le-theme-dark-green: #6ca437;
      --le-theme-deep-gray: #4c4d4f;
      --le-theme-black: #353535;
      --le-theme-gray-shade: #2a2a2a;
      --le-theme-white: #f8f8f8;
      --le-theme-true-white: #ffffff;
      --le-theme-vivid-blue: #49c6e5;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: var(--le-theme-white);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(152, 201, 61, 0.18), transparent 60%),
        linear-gradient(180deg, var(--le-theme-black), var(--le-theme-gray-shade));
    }

    main { text-align: center; }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--le-theme-le-green);
    }

    .rule {
      width: clamp(6rem, 22vw, 12rem);
      height: 6px;
      margin: 1.75rem auto;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--le-theme-dark-green),
        var(--le-theme-le-green),
        var(--le-theme-vivid-blue)
      );
    }

    p {
      margin: 0;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(248, 248, 248, 0.72);
    }

    @media (prefers-color-scheme: light) {
      body {
        color: var(--le-theme-deep-gray);
        background:
          radial-gradient(ellipse at 50% 0%, rgba(152, 201, 61, 0.22), transparent 60%),
          linear-gradient(180deg, var(--le-theme-true-white), var(--le-theme-white));
      }
      h1 { color: var(--le-theme-le-green-shade); }
      p { color: rgba(76, 77, 79, 0.75); }
    }

    @media (prefers-reduced-motion: no-preference) {
      main { animation: rise 0.6s ease-out both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <div class="rule"></div>
    <p>Leading EDJE</p>
  </main>
</body>
</html>
